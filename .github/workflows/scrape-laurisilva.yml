name: Scrape herbolario stores

on:
  workflow_dispatch:
    inputs:
      tienda:
        description: "Store to scrape (all, laurisilva, ventana_natural)"
        required: false
        default: "all"
  schedule:
    # 02:00 UTC daily (~03:00-04:00 Atlantic/Canary)
    - cron: "0 2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.2.2 \
            openai==1.43.0 \
            httpx==0.27.0 \
            qdrant-client==1.11.1 \
            phpserialize==1.3 \
            playwright==1.44.0 \
            playwright-stealth==1.0.6

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          SCRAPE_DELAY: "0.5"
        run: python scraper.py ${{ github.event.inputs.tienda || 'all' }}
